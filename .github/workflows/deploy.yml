name: Deploy a producción

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy por SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e

            # Cargar nvm para tener node/npm/pm2 en sesión no interactiva
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"

            cd ~/redadvenir

            echo "→ Actualizando código (forzado)..."
            git fetch origin main
            git reset --hard origin/main

            echo "→ Instalando dependencias..."
            npm ci

            echo "→ Compilando..."
            npm run build

            echo "→ Reiniciando servicio..."
            pm2 restart redadvenir || PORT=3000 pm2 start npm --name redadvenir -- start
            pm2 save

            echo "✓ Deploy completado"
