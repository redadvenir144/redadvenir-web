<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-label="Red ADvenir">
  <defs>
    <radialGradient id="depth" cx="50%" cy="48%" r="42%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Fondo de marca -->
  <rect width="1920" height="1080" fill="#0b2545" />
  <!-- Profundidad sutil detrás del logo -->
  <rect width="1920" height="1080" fill="url(#depth)" />

  <!-- Logo en texto (serif) -->
  <text x="960" y="560" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="150" font-weight="700" fill="#ffffff" letter-spacing="2">Red ADvenir</text>
  <text x="960" y="640" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="40" fill="#ffffff" fill-opacity="0.6" letter-spacing="6">TELEVISIÓN</text>
</svg>
